services:
  api:
    build:
      context: ../..
      dockerfile: products/api-service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      REVENUE_DASHBOARD_KEY: ${REVENUE_DASHBOARD_KEY:?Set REVENUE_DASHBOARD_KEY in .env}
      TOOLPIPE_ADMIN_KEY: ${TOOLPIPE_ADMIN_KEY:-}
      OXAPAY_MERCHANT_KEY: ${OXAPAY_MERCHANT_KEY:-}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      PAYMENTS_PUBLIC_BASE_URL: ${PAYMENTS_PUBLIC_BASE_URL:-}
      EVM_WALLET_ADDRESS: ${EVM_WALLET_ADDRESS:-}
      SOLANA_WALLET: ${SOLANA_WALLET:-}
    volumes:
      - api-data:/app/products/api-service/data
      - url-shortener-data:/app/products/url-shortener/data
      - uptime-monitor-data:/app/products/uptime-monitor/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/revenue-dashboard', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  api-data:
  url-shortener-data:
  uptime-monitor-data:
